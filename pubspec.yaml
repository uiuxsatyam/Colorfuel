name: color_fuel
description: A Flutter Kids Coloring App MVP.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.7
  path_provider: ^2.1.5
  permission_handler: ^11.0.1
  image: ^4.8.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/line_art/animals/
    - assets/line_art/fruits/
    - assets/line_art/vehicles/
    - assets/images/
